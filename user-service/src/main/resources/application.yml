server:
  port: 9000

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/maesamco
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true # 이슈 #10 — V1~V3 PostgreSQL 마이그레이션 및 Hibernate validate 검증 완료, 활성화
    schemas: user_schema

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_schema
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-service
      auto-offset-reset: earliest

  jackson:
    deserialization:
      fail-on-unknown-properties: true

security:
  email:
    encryption-key: ${EMAIL_ENCRYPTION_KEY}
    lookup-hmac-key: ${EMAIL_LOOKUP_HMAC_KEY}

  auth-session:
    refresh-token-rotation-grace-period: ${AUTH_SESSION_REFRESH_TOKEN_ROTATION_GRACE_PERIOD:5s}

jwt:
  public-key: ${JWT_PUBLIC_KEY}
  private-key: ${JWT_PRIVATE_KEY}
  refresh-public-key: ${JWT_REFRESH_PUBLIC_KEY}
  refresh-private-key: ${JWT_REFRESH_PRIVATE_KEY}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}

internal:
  hmac:
    keys:
      content-service: ${HMAC_KEY_CONTENT_TO_USER}
      judge-service: ${HMAC_KEY_JUDGE_TO_USER}
      coaching-service: ${HMAC_KEY_COACHING_TO_USER}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      probes:
        enabled: true

  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: ${TEMPO_OTLP_URL:http://localhost:4318/v1/traces}

# profile 없이 기본 실행할 때는 API 문서를 비활성화한다.
# 로컬 통합 테스트에서는 application-dev.yml에서 다시 활성화한다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
