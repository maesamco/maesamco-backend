spring:
  kafka:
    listener:
      auto-startup: false

  jpa:
    hibernate:
      # Flyway가 실제 PostgreSQL 스키마와 인덱스를 생성하므로
      # Hibernate는 엔티티 매핑과 스키마의 일치 여부만 검증합니다.
      ddl-auto: validate

    properties:
      hibernate:
        # User 엔티티가 사용하는 user_schema를 테스트 DB에 자동 생성합니다.
        default_schema: user_schema
        hbm2ddl:
          create_namespaces: true

security:
  social:
    google:
      client-id: test-google-client-id.apps.googleusercontent.com

  email:
    encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    lookup-hmac-key: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
