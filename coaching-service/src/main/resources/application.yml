server:
  port: 9003

spring:
  application:
    name: coaching-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/maesamco
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true # 이슈 #10 — V1 베이스라인 검증 완료(coaching-service 통합 테스트가 이 스크립트로 생성된 스키마를 실제로 검증함), 활성화
    schemas: coaching_schema
  jpa:
    hibernate:
      ddl-auto: validate # Flyway가 스키마를 관리하므로 검증만 수행
    properties:
      hibernate:
        default_schema: coaching_schema
        format_sql: true
        jdbc:
          time_zone: UTC
        type:
          # 클래스패스에 Jackson 2/3이 둘 다 있으면 Hibernate는 기본적으로 구버전(Jackson 2)을
          # 골라서, tools.jackson.databind.JsonNode(AiFeedback 등)를 못 역직렬화하고 실패한다
          # (실제 재현: InvalidDefinitionException). 명시적으로 Jackson 3 매퍼를 지정해야 한다.
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: coaching-service
      auto-offset-reset: earliest
  ai:
    # AI_MODEL_CHAT=anthropic(기본, 팀 컨벤션상 실제 벤더) 또는 google-genai(.env, 로컬 전용)
    # 값 하나로 벤더가 갈리며, ClaudeModelAdapter/GeminiModelAdapter도 이 프로퍼티 하나로 게이트된다.
    model:
      chat: ${AI_MODEL_CHAT:anthropic}
    retry:
      # content-service와 동일한 이유(튜터님 피드백) — 설정 안 하면 Spring AI 기본값(10회)이 그대로
      # 적용된다. 단, 이 프로퍼티는 spring-ai-retry의 RetryTemplate을 통해서만 적용되는데,
      # AnthropicChatAutoConfiguration은 이 RetryTemplate을 전혀 쓰지 않는다(자가 리뷰 재검증,
      # 2026-09-07 — 소스 직접 확인, AnthropicChatModel.java엔 "retry" 문자열 자체가 없음).
      # 즉 이 값은 Gemini(GoogleGenAiChatAutoConfiguration, 로컬 개발 전용)에만 적용되고,
      # 운영에서 실제로 쓰는 Anthropic 경로는 아래 anthropic.max-retries가 별도로 담당한다.
      max-attempts: ${SPRING_AI_RETRY_MAX_ATTEMPTS:2}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      # 튜터님 피드백 — 명시적 타임아웃 없이는 SDK 기본값에 그대로 의존하게 돼 호출 하나가
      # 응답 없이 오래 묶여있을 수 있다(위 retry와 곱해지면 더 길어짐).
      timeout: ${SPRING_AI_ANTHROPIC_TIMEOUT:30s}
      # 자가 리뷰 재검증(2026-09-07) — Anthropic 호출의 실제 재시도 횟수는 위
      # spring.ai.retry.max-attempts가 아니라 이 프로퍼티(AnthropicConnectionProperties,
      # Anthropic Java SDK 클라이언트 자체 재시도)가 결정한다. 설정 안 하면 SDK 기본값에
      # 그대로 맡겨져 우리가 재시도 횟수를 전혀 통제하지 못하는 상태가 된다.
      max-retries: ${SPRING_AI_ANTHROPIC_MAX_RETRIES:2}
      chat:
        options:
          model: claude-sonnet-5 # ⚠️ 팀 확인 필요 — 힌트 생성용 모델 티어 미확정, 임시값
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-3.6-flash # 로컬 전용(GeminiModelAdapter) — AI_MODEL_CHAT=google-genai일 때만 사용, 실제 호출로 확인(2026-09-02)
  cloud:
    openfeign:
      client:
        config:
          # CircuitBreaker는 실패율로 다음 호출을 차단할 뿐, 이미 진행 중인 느린 HTTP
          # 요청 자체의 응답 대기 시간은 제한하지 않는다(PR #127 심층 재검토, 2026-09-09).
          # 명시 안 하면 OpenFeign 기본값(연결 10s/응답 60s)에 그대로 의존하게 되는데,
          # 이 Client는 Hint/Explanation/Feedback 생성처럼 사용자 응답시간에 직접 영향을
          # 주는 경로에 연결될 예정이라 더 짧게 잡는다.
          content-service:
            connectTimeout: 2000
            readTimeout: 3000
          judge-service:
            connectTimeout: 2000
            readTimeout: 3000

jwt:
  public-key: ${JWT_PUBLIC_KEY}

internal:
  hmac:
    keys:
      content-service: ${HMAC_KEY_CONTENT_TO_COACHING}
    outbound:
      # 빈 문자열 기본값을 두지 않는다(PR #127 심층 재검토, 2026-09-09) — 위 keys.*(수신
      # 검증용)처럼 기본값 없이 fail-fast해야, 설정 누락 시 빈 secret으로 조용히 서명하고
      # 기동만 되는(실제 호출은 전부 401) 상태를 막을 수 있다.
      judge-service: ${HMAC_KEY_COACHING_TO_JUDGE} # 이 서비스가 Judge에게 보낼 때 서명하는 키(JudgeServiceFeignConfig)
      content-service: ${HMAC_KEY_COACHING_TO_CONTENT} # 이 서비스가 Content에게 보낼 때 서명하는 키(ContentServiceFeignConfig, 이슈 #62)

resilience4j:
  circuitbreaker:
    instances:
      judge-service: # JudgeServiceAdapter.getSubmission() — 힌트 생성 핵심 경로 호출(팀 컨벤션 2절)
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50 # ⚠️ 임계치는 초기값 — 실 트래픽 데이터로 조정할 것
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      content-service: # ContentServiceAdapter.getProblem() — 힌트/설명/피드백 프롬프트 품질용 조회(이슈 #62)
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50 # ⚠️ 임계치는 초기값 — 실 트래픽 데이터로 조정할 것
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      ai-model: # ClaudeModelAdapter/GeminiModelAdapter.generate() — 튜터님 피드백(외부 LLM 장애가
        # 내부 장애로 전파되지 않도록). Feign이 아니라 팀 컨벤션 2절 대상 밖이었으나 같은 원칙 적용.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50 # ⚠️ 임계치는 초기값 — 실 트래픽 데이터로 조정할 것
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_OTLP_URL:http://localhost:4318/v1/traces}

# ⚠️ 리뷰 반영: profile 없이 기본값으로는 문서 자체를 완전히 끈다.
# docker-compose가 이 서비스 포트를 호스트에 직접 노출하고 있어, Gateway를
# 건너뛰고 직접 접속하면 JwtValidationFilter(Gateway 계층에만 존재)가 적용 안 돼
# 인증 없이 API 문서가 노출될 수 있었다. Gateway의 application.yml과 동일한
# 패턴 — 로컬 통합 테스트용 설정은 application-dev.yml에 분리해뒀다
# (SPRING_PROFILES_ACTIVE=dev로 활성화).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
