server:
  port: 9003

spring:
  application:
    name: coaching-service
  datasource:
    url: jdbc:postgresql://localhost:5435/maesamco
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true # 이슈 #10 — V1 베이스라인 검증 완료(coaching-service 통합 테스트가 이 스크립트로 생성된 스키마를 실제로 검증함), 활성화
    schemas: coaching_schema
  jpa:
    hibernate:
      ddl-auto: validate # Flyway가 스키마를 관리하므로 검증만 수행
    properties:
      hibernate:
        default_schema: coaching_schema
        format_sql: true
        jdbc:
          time_zone: UTC
        type:
          # 클래스패스에 Jackson 2/3이 둘 다 있으면 Hibernate는 기본적으로 구버전(Jackson 2)을
          # 골라서, tools.jackson.databind.JsonNode(AiFeedback 등)를 못 역직렬화하고 실패한다
          # (실제 재현: InvalidDefinitionException). 명시적으로 Jackson 3 매퍼를 지정해야 한다.
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: coaching-service
      auto-offset-reset: earliest
  ai:
    # AI_MODEL_CHAT=anthropic(기본, 팀 컨벤션상 실제 벤더) 또는 google-genai(.env, 로컬 전용)
    # 값 하나로 벤더가 갈리며, ClaudeModelAdapter/GeminiModelAdapter도 이 프로퍼티 하나로 게이트된다.
    model:
      chat: ${AI_MODEL_CHAT:anthropic}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-5 # ⚠️ 팀 확인 필요 — 힌트 생성용 모델 티어 미확정, 임시값
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-3.6-flash # 로컬 전용(GeminiModelAdapter) — AI_MODEL_CHAT=google-genai일 때만 사용, 실제 호출로 확인(2026-09-02)

jwt:
  public-key: ${JWT_PUBLIC_KEY}

internal:
  hmac:
    keys:
      content-service: ${HMAC_KEY_CONTENT_TO_COACHING}
    outbound:
      judge-service: ${HMAC_KEY_COACHING_TO_JUDGE:} # 이 서비스가 Judge에게 보낼 때 서명하는 키(JudgeServiceFeignConfig)

resilience4j:
  circuitbreaker:
    instances:
      judge-service: # JudgeServiceAdapter.getSubmission() — 힌트 생성 핵심 경로 호출(팀 컨벤션 2절)
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50 # ⚠️ 임계치는 초기값 — 실 트래픽 데이터로 조정할 것
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_OTLP_URL:http://localhost:4318/v1/traces}