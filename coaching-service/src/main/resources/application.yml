server:
  port: 9003

spring:
  application:
    name: coaching-service
  datasource:
    url: jdbc:postgresql://localhost:5435/maesamco
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: coaching_schema
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: coaching-service
      auto-offset-reset: earliest

jwt:
  public-key: ${JWT_PUBLIC_KEY}

internal:
  hmac:
    keys: {}
    # 예: content-service: ${HMAC_KEY_CONTENT_TO_JUDGE}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_OTLP_URL:http://localhost:4318/v1/traces}
