# 통합 테스트용(로컬 전용) — SPRING_PROFILES_ACTIVE=dev 로 활성화해야만 적용된다.
# 기본 application.yml에서 springdoc을 꺼둔 이유(리뷰 반영): docker-compose가
# 이 서비스 포트를 호스트에 직접 노출하고 있어, profile 없이 그대로 배포되면
# API 문서가 인증 없이 노출될 수 있어서다.

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  # /internal/v1/** 는 다른 서비스 전용(HMAC 서명 인증)이라 사용자 클라이언트 대상
  # Swagger 문서에 노출하지 않는다(팀 컨벤션 19절 — /internal/v1/ 컨트롤러는 Swagger
  # 노출 대상이 아님). 이슈 #54가 이 서비스 최초의 /internal/v1/** 컨트롤러를 추가하면서
  # 처음 필요해진 설정이다.
  paths-to-exclude: /internal/v1/**
