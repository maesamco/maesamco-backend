plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // Tempo(OTLP) 분산 추적 — Initializr 카탈로그에 없어 수동 추가
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // 서드파티 — Initializr 카탈로그에 없어 수동 버전 관리(루트 build.gradle ext 참고)
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    implementation "org.bouncycastle:bcprov-jdk18on:${bouncycastleVersion}"

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    // Flyway — 이슈 #10, V1 베이스라인 검증 완료 후 실제 활성화(application.yml spring.flyway.enabled: true)
    // spring-boot-flyway(FlywayAutoConfiguration)는 반드시 implementation이어야 한다 —
    // testImplementation에만 있으면 패키징된 jar/Docker 실행 시 마이그레이션이 조용히 안 됨
    // (실제로 Schema validation: missing table로 재현됨, 리뷰 반영)
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-flyway'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Repository 통합/동시성 테스트용 — 팀 컨벤션 18절
    testImplementation 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    // 문제/일일퀴즈 생성 또는 힌트·역질문·피드백 생성용 — Spring AI (11절: 벤더 확정 시 아래 starter만 교체)
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'

    // 로컬 개발 전용 대체 벤더(GeminiModelAdapter, .env의 AI_MODEL_CHAT=google-genai) — 팀 컨벤션
    // 2절이 예고한 "벤더 변경 시 스타터 교체" 대상 중 하나를 실제로 병행 등록. 기본(Claude) 동작에는
    // 영향 없음 — ChatModel 빈은 spring.ai.model.chat 프로퍼티 값으로 갈리므로(ConditionalOnProperty,
    // Spring 프로필이 아님) 두 스타터가 같이 있어도 충돌하지 않는다.
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
}
