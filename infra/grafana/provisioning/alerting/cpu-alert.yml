apiVersion: 1

# 최종 프로젝트 기술 가이드라인 필수 요구사항:
# "CPU 사용량이 50% 이상일 때 자동으로 Slack에 알림"
# (인프라설계도.md 10-2절 확정값)
#
# ⚠️ 이 YAML의 alerting provisioning 스키마는 Grafana 버전에 따라 세부 필드가
# 달라질 수 있습니다. 실제로 docker compose up 후 Grafana 컨테이너 로그에서
# provisioning 에러가 없는지, Alerting > Alert rules 화면에 규칙이 정상
# 로드됐는지 반드시 확인해주세요.

contactPoints:
  - orgId: 1
    name: slack-cpu-alert
    receivers:
      - uid: slack-cpu-alert-receiver
        type: slack
        settings:
          url: $__env{SLACK_WEBHOOK_URL}
          title: '{{ .CommonLabels.alertname }} — CPU 사용량 경고'
          text: |
            서비스: {{ .CommonLabels.instance }}
            현재 값: {{ .CommonAnnotations.current_value }}
            트리거 시각: {{ .StartsAt }}

# PR #190 리뷰 — org 1의 알림 정책 트리는 파일마다 따로 있는 게 아니라 org당 하나뿐이다.
# 이 파일과 hint-lock-fallback-alert.yml이 둘 다 최상위 policies:를 각자 선언하면
# provisioning 로드 순서에 따라 나중에 적용되는 쪽이 이전 트리를 통째로 덮어써서, 이
# cpu-usage-over-50(자기 receiver가 없어 루트 정책에 의존)이 조용히 다른 채널/템플릿으로
# 새 나갈 수 있다(실제로 재현됨 — Grafana API로 확인 시 루트 receiver가
# slack-hint-lock-fallback-alert로 덮어써져 있었음). 그래서 org 1의 정책 트리는 이 파일
# 하나만 정의하고, hint-lock-fallback-alert.yml은 자기 policies:를 갖지 않는다 — 그
# 파일이 추가하는 알림(hint-lock/ai-feedback-retry-lock fallback)은 아래 routes:로
# component=lock-fallback 라벨을 매칭해서 별도 receiver로 보낸다. 규칙 제목(alertname)이
# 아니라 라벨로 매칭하는 이유: 제목 문구가 나중에 바뀌어도 라우팅이 안 깨지게 하기 위함.
policies:
  - orgId: 1
    receiver: slack-cpu-alert
    group_by: ['alertname']
    routes:
      - receiver: slack-hint-lock-fallback-alert
        object_matchers:
          - ['component', '=', 'lock-fallback']
        group_by: ['alertname']

groups:
  - orgId: 1
    name: cpu-usage-alerts
    folder: 매삼코 알림
    interval: 1m
    rules:
      - uid: cpu-usage-over-50
        title: CPU 사용량 50% 이상 (1분 지속)
        condition: C
        for: 1m
        annotations:
          current_value: '{{ $values.A }}'
        data:
          - refId: A
            datasourceUid: prometheus-uid
            relativeTimeRange:
              from: 600
              to: 0
            model:
              # 인스턴스(서비스)별 CPU 사용률(%) — process_cpu_usage는 Gauge이므로
              # rate()를 적용하지 않고 순간값을 그대로 사용. avg by(job)도 쓰지 않음 —
              # 5개 서비스가 전부 job=maesamco-services로 묶여있어 평균내면
              # 특정 서비스만의 이상치가 희석되어 알림을 놓칠 수 있음.
              # for: 1m이 이미 "지속 시간" 판단을 담당하므로 별도 집계 불필요.
              expr: 100 * process_cpu_usage
              instant: true
          - refId: C
            datasourceUid: '__expr__'
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
        labels:
          severity: warning