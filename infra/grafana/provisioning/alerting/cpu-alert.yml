apiVersion: 1

# 최종 프로젝트 기술 가이드라인 필수 요구사항:
# "CPU 사용량이 50% 이상일 때 자동으로 Slack에 알림"
# (인프라설계도.md 10-2절 확정값)
#
# ⚠️ 이 YAML의 alerting provisioning 스키마는 Grafana 버전에 따라 세부 필드가
# 달라질 수 있습니다. 실제로 docker compose up 후 Grafana 컨테이너 로그에서
# provisioning 에러가 없는지, Alerting > Alert rules 화면에 규칙이 정상
# 로드됐는지 반드시 확인해주세요.

contactPoints:
  - orgId: 1
    name: slack-cpu-alert
    receivers:
      - uid: slack-cpu-alert-receiver
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          title: '{{ .CommonLabels.alertname }} — CPU 사용량 경고'
          text: |
            서비스: {{ .CommonLabels.job }}
            현재 값: {{ .CommonAnnotations.current_value }}
            트리거 시각: {{ .StartsAt }}

policies:
  - orgId: 1
    receiver: slack-cpu-alert
    group_by: ['alertname']

groups:
  - orgId: 1
    name: cpu-usage-alerts
    folder: 매삼코 알림
    interval: 1m
    rules:
      - uid: cpu-usage-over-50
        title: CPU 사용량 50% 이상 (1분 지속)
        condition: C
        for: 1m
        annotations:
          current_value: '{{ $values.B }}'
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              # 컨테이너별 CPU 사용률(%) — cAdvisor/node-exporter 미도입 시
              # process_cpu_usage(Micrometer 기본 메트릭)로 임시 대체 가능
              expr: 100 * avg by (job) (rate(process_cpu_usage[1m]))
              instant: true
          - refId: B
            datasourceUid: prometheus
            model:
              expr: 100 * avg by (job) (rate(process_cpu_usage[1m]))
              instant: true
          - refId: C
            datasourceUid: '__expr__'
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
        labels:
          severity: warning