apiVersion: 1

# 이슈 #74 — Coaching Service의 힌트 생성 락(RedisHintGenerationLockAdapter)이
# Redis 장애 시 fail-open(락 없이 진행)하는데, 지금까지는 log.warn 한 줄만 남기고
# 넘어가서 "비용 보호 장치가 꺼진 상태"가 방치될 수 있었다. 이 카운터는 그 fail-open
# 시점에 Micrometer(hint.generation.lock.fallback, 태그 operation=try_lock/unlock)로
# 증가한다.
#
# tryLock 실패(operation="try_lock")만 알림 대상이다 — 락 없이 진행되어 동시 요청 시
# LLM 중복 호출이 실제로 가능해지는 상태이기 때문이다. unlock 실패(operation="unlock")는
# 이미 끝난 요청의 락 삭제만 실패한 것이라 TTL(30초)로 자연 만료되고, 그 사이엔 오히려
# 후속 요청이 과잉 차단될 뿐 비용 리스크는 아니라서 알림 조건에서 제외한다.
#
# Counter 타입이라 CPU 알림(Gauge, 순간값 임계치)과 달리 increase()로 구간 내
# 증가량을 본다. Warning/Critical 두 임계치는 실제 발생 빈도 데이터가 없는 상태에서
# 시작값으로 임의로 정한 것(MAX_RETRY_COUNT=3과 같은 성격) — 나중에 데이터가 쌓이면
# 조정한다.
#
# ⚠️ cpu-alert.yml과 마찬가지로, provisioning 후 Grafana 컨테이너 로그와
# Alerting > Alert rules 화면에서 정상 로드됐는지 확인 필요.

contactPoints:
  - orgId: 1
    name: slack-hint-lock-fallback-alert
    receivers:
      - uid: slack-hint-lock-fallback-receiver
        type: slack
        settings:
          url: $__env{SLACK_WEBHOOK_URL}
          title: '{{ .CommonLabels.alertname }} — 힌트 생성 락 fail-open 감지'
          text: |
            서비스: coaching-service
            심각도: {{ .CommonLabels.severity }}
            최근 발생 건수: {{ .CommonAnnotations.recent_count }}
            트리거 시각: {{ .StartsAt }}

policies:
  - orgId: 1
    receiver: slack-hint-lock-fallback-alert
    group_by: ['alertname']

groups:
  - orgId: 1
    name: hint-lock-fallback-alerts
    folder: 매삼코 알림
    interval: 1m
    rules:
      - uid: hint-lock-fallback-warning
        title: 힌트 생성 락 fail-open 발생 (Warning, 5분 내 1건 이상)
        condition: C
        for: 0m
        annotations:
          recent_count: '{{ $values.A }}'
        data:
          - refId: A
            datasourceUid: prometheus-uid
            relativeTimeRange:
              from: 300
              to: 0
            model:
              # try_lock 실패만 본다(unlock 실패는 비용 리스크가 아니라서 제외).
              expr: sum(increase(hint_generation_lock_fallback_total{operation="try_lock"}[5m]))
              instant: true
          - refId: C
            datasourceUid: '__expr__'
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          severity: warning

      - uid: hint-lock-fallback-critical
        title: 힌트 생성 락 fail-open 지속 (Critical, 15분 내 5건 이상)
        condition: C
        for: 0m
        annotations:
          recent_count: '{{ $values.A }}'
        data:
          - refId: A
            datasourceUid: prometheus-uid
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: sum(increase(hint_generation_lock_fallback_total{operation="try_lock"}[15m]))
              instant: true
          - refId: C
            datasourceUid: '__expr__'
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gte
                    params: [5]
        labels:
          severity: critical
