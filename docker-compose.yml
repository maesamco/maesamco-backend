version: "3.8"

# 로컬 개발용 전체 인프라 + 서비스 기동 파일.
# 사용법:
#   1) .env.example을 복사해 .env로 만들고 값을 채운다
#   2) docker compose up -d
# 배포(prod) 환경에서는 api-gateway 외 포트를 절대 host에 노출하지 않습니다(인프라설계도.md 참고).

services:
  # ================= 데이터베이스 (서비스별 물리 분리) =================
  postgres-user:
    image: postgres:16
    container_name: postgres-user
    environment:
      POSTGRES_DB: maesamco
      POSTGRES_USER: ${DB_USERNAME:-maesamco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pg-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maesamco"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-content:
    image: postgres:16
    container_name: postgres-content
    environment:
      POSTGRES_DB: maesamco
      POSTGRES_USER: ${DB_USERNAME:-maesamco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - pg-content-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maesamco"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-judge:
    image: postgres:16
    container_name: postgres-judge
    environment:
      POSTGRES_DB: maesamco
      POSTGRES_USER: ${DB_USERNAME:-maesamco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5434:5432"
    volumes:
      - pg-judge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maesamco"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-coaching:
    image: postgres:16
    container_name: postgres-coaching
    environment:
      POSTGRES_DB: maesamco
      POSTGRES_USER: ${DB_USERNAME:-maesamco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5435:5432"
    volumes:
      - pg-coaching-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maesamco"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================= Redis =================
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  # ================= Kafka (KRaft 모드) + Kafka-UI =================
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"   # 포트 확정 — 게이트웨이_인프라_API명세서.md 9절/10-1절 참고
    environment:
      KAFKA_CLUSTERS_0_NAME: "maesamco"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    depends_on:
      - kafka

  # ================= Judge0 =================
  # ⚠️ 플레이스홀더: Judge0는 자체적으로 PostgreSQL·Redis·Server·Worker로 구성된
  # 별도의 다중 컨테이너 스택입니다(공식: https://github.com/judge0/judge0).
  # 여기서는 자리만 남겨두고, 실제 연동 시 공식 docker-compose를 이 파일에 merge하거나
  # `docker compose -f docker-compose.yml -f judge0/docker-compose.yml up -d` 형태로 합쳐 씁니다.
  # judge0:
  #   image: judge0/judge0:1.13.1
  #   ports:
  #     - "2358:2358"

  # ================= 모니터링 =================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  # ================= 애플리케이션 =================
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - redis

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "9000:9000"
    environment:
      DB_USERNAME: ${DB_USERNAME:-maesamco}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  content-service:
    build: ./content-service
    container_name: content-service
    ports:
      - "9001:9001"
    environment:
      DB_USERNAME: ${DB_USERNAME:-maesamco}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres-content:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  judge-service:
    build: ./judge-service
    container_name: judge-service
    ports:
      - "9002:9002"
    environment:
      DB_USERNAME: ${DB_USERNAME:-maesamco}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-http://judge0:2358}
    depends_on:
      postgres-judge:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  coaching-service:
    build: ./coaching-service
    container_name: coaching-service
    ports:
      - "9003:9003"
    environment:
      DB_USERNAME: ${DB_USERNAME:-maesamco}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres-coaching:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

volumes:
  pg-user-data:
  pg-content-data:
  pg-judge-data:
  pg-coaching-data:
  kafka-data:
