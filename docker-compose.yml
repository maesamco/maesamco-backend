version: "3.8"

# 로컬 개발용 전체 인프라 + 서비스 기동 파일.
# 사용법:
#   1) .env.example을 복사해 .env로 만들고 값을 채운다
#   2) docker compose up -d
# 배포(prod) 환경에서는 api-gateway 외 포트를 절대 host에 노출하지 않습니다(인프라설계도.md 참고).

services:
  # ================= 데이터베이스 (서비스별 물리 분리) =================
  postgres-user:
    image: postgres:16
    container_name: postgres-user
    environment:
      POSTGRES_DB: maesamco
      POSTGRES_USER: ${DB_USERNAME:-maesamco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pg-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maesamco"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-content:
    image: postgres:16
    container_name: postgres-content
    environment:
      POSTGRES_DB: maesamco
      POSTGRES_USER: ${DB_USERNAME:-maesamco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - pg-content-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maesamco"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-judge:
    image: postgres:16
    container_name: postgres-judge
    environment:
      POSTGRES_DB: maesamco
      POSTGRES_USER: ${DB_USERNAME:-maesamco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5434:5432"
    volumes:
      - pg-judge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maesamco"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-coaching:
    image: postgres:16
    container_name: postgres-coaching
    environment:
      POSTGRES_DB: maesamco
      POSTGRES_USER: ${DB_USERNAME:-maesamco}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5435:5432"
    volumes:
      - pg-coaching-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "maesamco"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================= Redis =================
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  # ================= Kafka (KRaft 모드, Apache 공식 이미지) + Kafka-UI =================
  # ⚠️ bitnami/kafka가 Docker Hub에서 태그 접근이 안 돼서(Broadcom 인수 이후
  # 무료 이미지 정리 추정) Apache 공식 이미지로 교체함. 환경변수 접두어가
  # KAFKA_CFG_*(Bitnami) → KAFKA_*(Apache 공식, 접두어 없음)로 바뀝니다.
  # ⚠️ 이 설정은 아직 실제로 띄워서 완전히 검증되지 않았습니다 —
  # 부팅 로그를 꼭 확인해주세요. 특히 데이터 디렉토리 경로(KAFKA_LOG_DIRS)와
  # healthcheck의 kafka-topics.sh 경로는 이미지 안 실제 위치와 다를 수 있습니다.
  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    ports:
      - "29092:29092"   # 호스트(로컬 IntelliJ 등)에서 접속할 땐 이 포트 사용
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      # PLAINTEXT: 컨테이너 간 통신용(도커 내부망), PLAINTEXT_HOST: 호스트 머신 접속용
      KAFKA_LISTENERS: "PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # 단일 브로커 구성이라 기본값(replication.factor: 3)이면 내부 토픽
      # (__consumer_offsets 등) 생성이 실패함 — 리뷰 반영, 공식 단일 노드 예시값
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"   # 포트 확정 — 게이트웨이_인프라_API명세서.md 9절/10-1절 참고
    environment:
      KAFKA_CLUSTERS_0_NAME: "maesamco"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy

  # ================= Judge0 =================
  # ⚠️ 플레이스홀더: Judge0는 자체적으로 PostgreSQL·Redis·Server·Worker로 구성된
  # 별도의 다중 컨테이너 스택입니다(공식: https://github.com/judge0/judge0).
  # 여기서는 자리만 남겨두고, 실제 연동 시 공식 docker-compose를 이 파일에 merge하거나
  # `docker compose -f docker-compose.yml -f judge0/docker-compose.yml up -d` 형태로 합쳐 씁니다.
  # judge0:
  #   image: judge0/judge0:1.13.1
  #   ports:
  #     - "2358:2358"

  # ================= 모니터링 =================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  # ================= 애플리케이션 =================
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - redis

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "9000:9000"
    environment:
      DB_USERNAME: ${DB_USERNAME:-maesamco}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  content-service:
    build:
      context: .
      dockerfile: content-service/Dockerfile
    container_name: content-service
    ports:
      - "9001:9001"
    environment:
      DB_USERNAME: ${DB_USERNAME:-maesamco}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      HMAC_KEY_COACHING_TO_CONTENT: ${HMAC_KEY_COACHING_TO_CONTENT}
    depends_on:
      postgres-content:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  judge-service:
    build:
      context: .
      dockerfile: judge-service/Dockerfile
    container_name: judge-service
    ports:
      - "9002:9002"
    environment:
      DB_USERNAME: ${DB_USERNAME:-maesamco}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-http://judge0:2358}
      HMAC_KEY_CONTENT_TO_JUDGE: ${HMAC_KEY_CONTENT_TO_JUDGE}
      HMAC_KEY_COACHING_TO_JUDGE: ${HMAC_KEY_COACHING_TO_JUDGE}
    depends_on:
      postgres-judge:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  coaching-service:
    build:
      context: .
      dockerfile: coaching-service/Dockerfile
    container_name: coaching-service
    ports:
      - "9003:9003"
    environment:
      DB_USERNAME: ${DB_USERNAME:-maesamco}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      HMAC_KEY_CONTENT_TO_COACHING: ${HMAC_KEY_CONTENT_TO_COACHING}
    depends_on:
      postgres-coaching:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

volumes:
  pg-user-data:
  pg-content-data:
  pg-judge-data:
  pg-coaching-data:
  kafka-data: