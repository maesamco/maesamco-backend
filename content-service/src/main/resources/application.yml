server:
  port: 9001

spring:
  application:
    name: content-service
  ai:
    model:
      chat: ${AI_MODEL_CHAT:anthropic}
    retry:
      # 슬롯별 최초 요청 1회와 일시적 오류 재시도 1회만 허용해 배치 지연과 AI 호출 비용을 제한합니다.
      max-attempts: ${SPRING_AI_RETRY_MAX_ATTEMPTS:2}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/maesamco
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # 신규·기존 DB의 Flyway 전환 경로를 통합 테스트에서 검증한 뒤 활성화합니다.
    enabled: false
    schemas: content_schema
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: content_schema
        format_sql: true
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: content-service
      auto-offset-reset: earliest

jwt:
  public-key: ${JWT_PUBLIC_KEY}

internal:
  hmac:
    keys:
      coaching-service: ${HMAC_KEY_COACHING_TO_CONTENT}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_OTLP_URL:http://localhost:4318/v1/traces}

# ⚠️ 리뷰 반영: profile 없이 기본값으로는 문서 자체를 완전히 끈다.
# docker-compose가 이 서비스 포트를 호스트에 직접 노출하고 있어, Gateway를
# 건너뛰고 직접 접속하면 JwtValidationFilter(Gateway 계층에만 존재)가 적용 안 돼
# 인증 없이 API 문서가 노출될 수 있었다. Gateway의 application.yml과 동일한
# 패턴 — 로컬 통합 테스트용 설정은 application-dev.yml에 분리해뒀다
# (SPRING_PROFILES_ACTIVE=dev로 활성화).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
