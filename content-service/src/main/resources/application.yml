server:
  port: 9001

spring:
  application:
    name: content-service
  ai:
    model:
      chat: ${AI_MODEL_CHAT:anthropic}
    retry:
      # 형식 검증 실패 시 애플리케이션에서 1회 재생성하므로, 전송 계층은 추가 재시도하지 않습니다.
      max-attempts: ${SPRING_AI_RETRY_MAX_ATTEMPTS:1}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-3.6-flash}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/maesamco
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # 신규·기존 DB의 Flyway 전환 경로를 통합 테스트에서 검증한 뒤 활성화합니다.
    enabled: true
    schemas: content_schema
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: content_schema
        format_sql: true
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
    topic:
      problem-published: ${KAFKA_TOPIC_PROBLEM_PUBLISHED:problem-published-events}
      daily-quiz-completed: ${KAFKA_TOPIC_DAILY_QUIZ_COMPLETED:daily-quiz-completed-events}
      submission-judged: ${KAFKA_TOPIC_SUBMISSION_JUDGED:submission-judged-events}
    consumer:
      group-id: content-service
      auto-offset-reset: earliest
      group:
        submission-judged: ${KAFKA_CONSUMER_GROUP_SUBMISSION_JUDGED:content-service-submission-judged-group}

outbox:
  daily-quiz-completed:
    relay:
      # 기본 환경과 테스트에서는 자동 Relay를 실행하지 않습니다.
      # 실제 통합 실행 환경에서 명시적으로 활성화합니다.
      enabled: ${DAILY_QUIZ_COMPLETED_OUTBOX_RELAY_ENABLED:false}

      # 이전 Relay 실행이 끝난 뒤 다음 실행까지 기다리는 시간입니다.
      fixed-delay-ms: ${DAILY_QUIZ_COMPLETED_OUTBOX_RELAY_FIXED_DELAY_MS:1000}

      # 한 번의 polling에서 처리할 최대 PENDING Outbox 개수입니다.
      batch-size: ${DAILY_QUIZ_COMPLETED_OUTBOX_RELAY_BATCH_SIZE:50}

      # Worker 장애 시 다른 Worker가 선점을 복구할 수 있는 만료 시간입니다.
      # 한 건의 Kafka ACK 대기 시간과 상태 저장 시간을 포함할 수 있도록 설정합니다.
      lease-duration-ms: ${DAILY_QUIZ_COMPLETED_OUTBOX_RELAY_LEASE_DURATION_MS:300000}

      # Kafka ACK를 기다리는 최대 시간입니다.
      publish-timeout-ms: ${DAILY_QUIZ_COMPLETED_OUTBOX_RELAY_PUBLISH_TIMEOUT_MS:5000}

      # Kafka 발행 전 허용할 JSON payload의 최대 UTF-8 바이트 크기입니다.
      max-payload-bytes: ${DAILY_QUIZ_COMPLETED_OUTBOX_RELAY_MAX_PAYLOAD_BYTES:900000}

      # 확정적인 Kafka 발행 실패를 재시도할 최대 횟수입니다.
      max-retry-count: ${DAILY_QUIZ_COMPLETED_OUTBOX_RELAY_MAX_RETRY_COUNT:10}

      # 실패 후 첫 재시도까지 기다릴 기본 시간입니다.
      backoff-base-ms: ${DAILY_QUIZ_COMPLETED_OUTBOX_RELAY_BACKOFF_BASE_MS:1000}

      # 지수 백오프가 증가할 수 있는 최대 시간입니다.
      backoff-max-ms: ${DAILY_QUIZ_COMPLETED_OUTBOX_RELAY_BACKOFF_MAX_MS:60000}

  problem-published:
    relay:
      # 기본 환경과 테스트에서는 자동 Relay를 실행하지 않습니다.
      # 실제 통합 실행 환경에서 명시적으로 활성화합니다.
      enabled: ${PROBLEM_PUBLISHED_OUTBOX_RELAY_ENABLED:false}

      # 한 번의 polling에서 처리할 최대 PENDING Outbox 개수입니다.
      batch-size: ${PROBLEM_PUBLISHED_OUTBOX_RELAY_BATCH_SIZE:50}

      # Kafka ACK를 기다리는 최대 시간입니다.
      publish-timeout-ms: ${PROBLEM_PUBLISHED_OUTBOX_RELAY_PUBLISH_TIMEOUT_MS:5000}

      # 다중 인스턴스 중복 발행 방지를 위한 Outbox 선점(lease) 유지 시간입니다.
      # 처리 중인 인스턴스가 종료되면 이 시간이 지난 뒤 다른 인스턴스가 재선점합니다.
      # 한 건의 Kafka ACK 대기 시간 + 상태 저장 시간을 충분히 넘도록 설정합니다.
      # (publish-timeout-ms + 1000ms 이상이어야 하며, 그렇지 않으면 기동 시 실패합니다.)
      lease-duration-ms: ${PROBLEM_PUBLISHED_OUTBOX_RELAY_LEASE_DURATION_MS:60000}

      # Kafka 발행 전 허용할 직렬화 payload의 최대 UTF-8 바이트 크기입니다.
      max-payload-bytes: ${PROBLEM_PUBLISHED_OUTBOX_RELAY_MAX_PAYLOAD_BYTES:900000}

      # 이전 Relay 실행이 끝난 뒤 다음 실행까지 기다리는 시간입니다.
      fixed-delay-ms: ${PROBLEM_PUBLISHED_OUTBOX_RELAY_FIXED_DELAY_MS:1000}

jwt:
  public-key: ${JWT_PUBLIC_KEY}

internal:
  hmac:
    keys:
      coaching-service: ${HMAC_KEY_COACHING_TO_CONTENT}
    outbound:
      user-service: ${HMAC_KEY_CONTENT_TO_USER}

resilience4j:
  circuitbreaker:
    instances:
      user-service: # UserFeignAdapter.getInterestConceptIds() — Daily Quiz 콜드스타트 조회
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

daily-quiz:
  batch:
    cron: "${DAILY_QUIZ_BATCH_CRON:0 0 3 * * *}"
    zone: ${DAILY_QUIZ_BATCH_ZONE:Asia/Seoul}
    chunk-size: ${DAILY_QUIZ_BATCH_CHUNK_SIZE:100}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_OTLP_URL:http://localhost:4318/v1/traces}

# ⚠️ 리뷰 반영: profile 없이 기본값으로는 문서 자체를 완전히 끈다.
# docker-compose가 이 서비스 포트를 호스트에 직접 노출하고 있어, Gateway를
# 건너뛰고 직접 접속하면 JwtValidationFilter(Gateway 계층에만 존재)가 적용 안 돼
# 인증 없이 API 문서가 노출될 수 있었다. Gateway의 application.yml과 동일한
# 패턴 — 로컬 통합 테스트용 설정은 application-dev.yml에 분리해뒀다
# (SPRING_PROFILES_ACTIVE=dev로 활성화).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
