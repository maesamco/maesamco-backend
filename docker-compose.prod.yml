version: "3.8"

# AWS 배포용(EC2 + RDS) 인프라 + 서비스 기동 파일.
# 로컬 개발용 docker-compose.yml에서 postgres 4개 컨테이너를 제거하고,
# 각 서비스가 RDS(PostgreSQL) 엔드포인트를 바라보도록 바꾼 버전입니다.
# 10/1 시연 전 통합테스트 목적의 임시 배포 구성 — ALB 없이 EC2 IP로 api-gateway(8080)만
# 직접 노출합니다. 나머지 포트(redis/kafka-ui/prometheus/grafana)는 보안그룹에서
# 특정 IP(관리자 SSH 대역)로만 열어뒀습니다 — 인프라설계도.md 원칙(운영에선 api-gateway
# 외 포트를 host에 노출하지 않음)과 달리 지금은 관측/디버깅 편의를 위해 좁게 열어둔
# 임시 예외입니다. 정식 운영 배포 시엔 재검토 필요.
#
# 사용법(EC2 안에서):
#   1) fetch-env.sh로 SSM Parameter Store에서 .env 생성 (RDS_ENDPOINT는 직접 채울 것)
#   2) docker compose -f docker-compose.prod.yml up -d

services:
  # ================= 데이터베이스 (서비스별 물리 분리) =================
  # ================= Redis =================
  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6500:6379"   # 로컬용 docker-compose.yml에서 그대로 가져온 매핑(Windows 예약 포트
      # 회피용) — AWS EC2(Linux)엔 해당 없는 이유지만, 로컬과 포트 번호를
      # 맞춰두면 헷갈릴 일이 없어 그대로 유지(컨테이너 내부는 6379)

  # ================= Kafka (KRaft 모드, Apache 공식 이미지) + Kafka-UI =================
  # ⚠️ bitnami/kafka가 Docker Hub에서 태그 접근이 안 돼서(Broadcom 인수 이후
  # 무료 이미지 정리 추정) Apache 공식 이미지로 교체함. 환경변수 접두어가
  # KAFKA_CFG_*(Bitnami) → KAFKA_*(Apache 공식, 접두어 없음)로 바뀝니다.
  # ⚠️ 이 설정은 아직 실제로 띄워서 완전히 검증되지 않았습니다 —
  # 부팅 로그를 꼭 확인해주세요. 특히 데이터 디렉토리 경로(KAFKA_LOG_DIRS)와
  # healthcheck의 kafka-topics.sh 경로는 이미지 안 실제 위치와 다를 수 있습니다.
  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    restart: unless-stopped
    ports:
      - "29092:29092"   # 호스트(로컬 IntelliJ 등)에서 접속할 땐 이 포트 사용
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      # PLAINTEXT: 컨테이너 간 통신용(도커 내부망), PLAINTEXT_HOST: 호스트 머신 접속용
      KAFKA_LISTENERS: "PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # 단일 브로커 구성이라 기본값(replication.factor: 3)이면 내부 토픽
      # (__consumer_offsets 등) 생성이 실패함 — 리뷰 반영, 공식 단일 노드 예시값
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"   # 포트 확정 — 게이트웨이_인프라_API명세서.md 9절/10-1절 참고
    environment:
      KAFKA_CLUSTERS_0_NAME: "maesamco"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy

  # ================= Judge0 =================
  # 실제 코드 채점 스택. Windows+Docker Desktop에서만 알려진 실행 호환성 문제가
  # 있었고, 여기(AWS EC2, 리눅스)는 Docker를 네이티브로 돌리니 그 문제 자체가
  # 없다 — 배포 후엔 어느 OS에서 개발하는 팀원이든 HTTP로 이 엔드포인트만
  # 호출하면 되므로 다들 이 배포본 하나만 쓰면 된다.
  #
  # 공식 docker-compose(judge0/judge0 GitHub)의 4개 서비스(server/worker/db/redis)를
  # 그대로 가져왔다 — server만 우리 쪽 명명 규칙(judge0)에 맞춰 이름을 바꿨고,
  # 나머지는 공식 이미지/설정 그대로다. judge0-db/judge0-redis는 우리 앱의
  # RDS/Redis와 완전히 분리된, Judge0 전용 별도 인스턴스다(공식 스택이 원래
  # 그렇게 설계됨 — 공유하지 않는 것이 의도된 격리).
  judge0:
    image: judge0/judge0:1.13.1
    container_name: judge0
    env_file: judge0.conf
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis
    restart: always

  judge0-worker:
    image: judge0/judge0:1.13.1
    container_name: judge0-worker
    command: ["./scripts/workers"]
    env_file: judge0.conf
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis
    restart: always

  judge0-db:
    image: postgres:16.2
    container_name: judge0-db
    env_file: judge0.conf
    volumes:
      - judge0-data:/var/lib/postgresql/data/
    restart: always

  judge0-redis:
    image: redis:7.2.4
    container_name: judge0-redis
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    restart: always

  # ================= 모니터링 =================
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:13.0.8
    container_name: grafana
    restart: unless-stopped
    ports:
      - "4000:3000"   # 로컬용 docker-compose.yml에서 그대로 가져온 매핑(Windows 예약 포트
      # 회피용) — AWS EC2(Linux)엔 해당 없는 이유지만, 로컬과 포트 번호를
      # 맞춰두면 헷갈릴 일이 없어 그대로 유지(컨테이너 내부는 3000)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      # ⚠️ 실제 배포로 발견 — 이 설정이 없으면 Grafana가 기본값(http://localhost:3000)을
      # 알림 링크 생성에 그대로 써서, Slack 등으로 온 알림의 링크를 클릭해도
      # 받는 사람 컴퓨터의 localhost로 가버려 아무것도 안 열림. 외부에서 실제로
      # 접속 가능한 주소(EC2 IP:4000)로 명시해야 한다.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      # ⚠️ 실제 운영 중 발견 — 이 볼륨(grafana-data)이 없으면 Import한 대시보드가
      # /var/lib/grafana(SQLite DB, Grafana 내부 상태 저장 위치)에 저장되는데,
      # 이 경로가 영구 볼륨에 안 걸려있어서 컨테이너 재시작(재배포, EC2 재부팅 등)
      # 때마다 Import했던 대시보드가 전부 사라지던 문제.
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ================= 애플리케이션 =================
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    # ⚠️ 이슈 #310 — 예전엔 8080을 호스트에 직접 노출해서 평문 HTTP로만
    # 접근 가능했음(Refresh Token 쿠키의 Secure 속성이 평문 HTTP에서
    # 브라우저가 전송을 거부해 refresh가 항상 401이었던 원인). 이제
    # Caddy가 TLS를 종단하고 내부적으로만 이 포트를 호출하므로, 호스트에
    # 더 이상 직접 노출하지 않는다(같은 docker 네트워크 안에서
    # "api-gateway:8080"으로 Caddy가 접근).
    expose:
      - "8080"
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_URL: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # JMeter 부하 테스트용 — 테스트 직전에만 .env에서 넉넉한 값으로 올렸다가 끝나면 지우면 됨.
      # 안 채우면 기본값(분당 30회) 그대로 적용되어 평소엔 안전함(리뷰 반영 — 실제 컨테이너에
      # 값이 전달 안 되고 있던 걸 발견해 수정).
      RATE_LIMIT_SUBMISSIONS_PER_MIN: ${RATE_LIMIT_SUBMISSIONS_PER_MIN:-30}
      RATE_LIMIT_SUBMISSIONS_READ_PER_MIN: ${RATE_LIMIT_SUBMISSIONS_READ_PER_MIN:-300}
      # 배포 시 Gateway 앞에 신뢰 가능한 리버스 프록시를 두게 되면 그 IP를 콤마로 구분해 채운다.
      # 비워두면(기본값) Forwarded 헤더를 아무도 신뢰하지 않아 항상 안전하다.
      # ⚠️ 이슈 #310 — Caddy를 앞단에 뒀으므로 이제 채워야 함. docker-compose
      # 내부 네트워크(bridge)의 caddy 컨테이너 IP는 재시작마다 바뀔 수 있어,
      # 컨테이너 이름 기반이 아니라 실제로는 이 네트워크의 서브넷 CIDR
      # 전체(예: 172.20.0.0/16, docker network inspect로 확인)를 넣는 게
      # 안전하다. 최초 배포 후 실제 값 확인해서 .env에 채워 넣을 것.
      RATE_LIMIT_TRUSTED_PROXY_IPS: ${RATE_LIMIT_TRUSTED_PROXY_IPS:-}
    depends_on:
      - eureka-server
      - redis

  # ⚠️ 이슈 #310 — TLS 종단 담당. 도메인이 없어 nip.io(EC2 Elastic IP를 그대로
  # 가리키는 무료 와일드카드 DNS)로 Let's Encrypt 인증서를 자동 발급·갱신한다.
  # 이제 외부에서 이 서비스가 유일한 진입점이며(80/443), api-gateway는
  # 더 이상 호스트에 직접 노출되지 않는다.
  # ⚠️ 리뷰 반영(P1) — RATE_LIMIT_TRUSTED_PROXY_IPS에 Docker 서브넷 CIDR을
  # 넣으라고 안내했었으나, RateLimitFilter가 정확 일치(contains)만 지원해서
  # CIDR이 절대 매치되지 않았음(코드 미수정으로 발견). 대신 Caddy에 "고정 IP"를
  # 부여하고, fetch-env.sh가 그 정확한 값을 RATE_LIMIT_TRUSTED_PROXY_IPS에
  # 쓰도록 해서 정확 일치 방식과 맞춘다. 커스텀 브리지 네트워크가 있어야
  # 컨테이너에 고정 IP를 줄 수 있어(default 네트워크는 불가) 여기서 새로 정의.
  caddy:
    image: caddy:2.8-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # fetch-env.sh가 SSM의 EC2_ELASTIC_IP 값(점(.) 포함)을 받아 하이픈으로
      # 바꿔서 채운다 — nip.io 서브도메인은 라벨 하나여야 해서 점을 못 씀.
      EC2_ELASTIC_IP_DASHED: ${EC2_ELASTIC_IP_DASHED:?fetch-env.sh를 먼저 실행하세요}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서를 컨테이너 재시작 후에도 유지 — 없으면 재시작마다 Let's Encrypt에
      # 재발급을 요청하게 되어 Rate Limit(주당 발급 한도)에 걸릴 위험이 있다.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # ⚠️ 리뷰 반영(P1) — RATE_LIMIT_TRUSTED_PROXY_IPS와 정확히 일치해야
        # 하므로 반드시 고정값. 이 값을 바꾸면 fetch-env.sh의 같은 값도 함께
        # 바꿔야 한다(맨 아래 networks.default.ipam 서브넷과 같은 대역이어야 함).
        ipv4_address: 172.28.255.10
    depends_on:
      - api-gateway

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      DB_USERNAME: ${DB_USERNAME:-maesamco}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_HOST: ${RDS_ENDPOINT}
      DB_PORT: "5432"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_REFRESH_PUBLIC_KEY: ${JWT_REFRESH_PUBLIC_KEY}
      JWT_REFRESH_PRIVATE_KEY: ${JWT_REFRESH_PRIVATE_KEY}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY}
      EMAIL_LOOKUP_HMAC_KEY: ${EMAIL_LOOKUP_HMAC_KEY}
      # 이슈(배포 스크립트 리뷰) — EMAIL_VERIFICATION_HMAC_KEY는 application.yml에
      # 기본값이 없어서, 이 변수가 전달 안 되면 user-service가 부팅 자체를 못 한다.
      EMAIL_VERIFICATION_HMAC_KEY: ${EMAIL_VERIFICATION_HMAC_KEY}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-true}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
      HMAC_KEY_CONTENT_TO_USER: ${HMAC_KEY_CONTENT_TO_USER}
      HMAC_KEY_JUDGE_TO_USER: ${HMAC_KEY_JUDGE_TO_USER}
      HMAC_KEY_COACHING_TO_USER: ${HMAC_KEY_COACHING_TO_USER}
      # ⚠️ 리뷰로 발견 — User → Content 내부 통신용(user-service가 발신자일 때 서명할 키)
      HMAC_KEY_USER_TO_CONTENT: ${HMAC_KEY_USER_TO_CONTENT}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/api/v1/auth}

      MAIL_CONNECTION_TIMEOUT_MS: ${MAIL_CONNECTION_TIMEOUT_MS:-5000}
      MAIL_READ_TIMEOUT_MS: ${MAIL_READ_TIMEOUT_MS:-5000}
      MAIL_WRITE_TIMEOUT_MS: ${MAIL_WRITE_TIMEOUT_MS:-5000}

      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-false}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.0}
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  content-service:
    build:
      context: .
      dockerfile: content-service/Dockerfile
    container_name: content-service
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      DB_USERNAME: ${DB_USERNAME:-maesamco}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_HOST: ${RDS_ENDPOINT}
      DB_PORT: "5432"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROBLEM_PUBLISHED_OUTBOX_RELAY_ENABLED: "true"
      DAILY_QUIZ_COMPLETED_OUTBOX_RELAY_ENABLED: "${DAILY_QUIZ_COMPLETED_OUTBOX_RELAY_ENABLED:-false}"
      DAILY_QUIZ_BATCH_ENABLED: "${DAILY_QUIZ_BATCH_ENABLED:-false}"
      EUREKA_URL: http://eureka-server:8761/eureka/
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_MODEL_CHAT: ${AI_MODEL_CHAT:-anthropic}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      HMAC_KEY_COACHING_TO_CONTENT: ${HMAC_KEY_COACHING_TO_CONTENT}
      # ⚠️ 리뷰로 발견 — User → Content 내부 통신용(content-service가 수신자일 때 검증할 키)
      HMAC_KEY_USER_TO_CONTENT: ${HMAC_KEY_USER_TO_CONTENT}
      HMAC_KEY_CONTENT_TO_USER: ${HMAC_KEY_CONTENT_TO_USER}
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  judge-service:
    build:
      context: .
      dockerfile: judge-service/Dockerfile
    container_name: judge-service
    restart: unless-stopped
    ports:
      - "9002:9002"
    environment:
      DB_USERNAME: ${DB_USERNAME:-maesamco}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_HOST: ${RDS_ENDPOINT}
      DB_PORT: "5432"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-http://judge0:2358}
      HMAC_KEY_CONTENT_TO_JUDGE: ${HMAC_KEY_CONTENT_TO_JUDGE}
      HMAC_KEY_COACHING_TO_JUDGE: ${HMAC_KEY_COACHING_TO_JUDGE}
      HMAC_KEY_JUDGE_TO_USER: ${HMAC_KEY_JUDGE_TO_USER}
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  coaching-service:
    build:
      context: .
      dockerfile: coaching-service/Dockerfile
    container_name: coaching-service
    restart: unless-stopped
    ports:
      - "9003:9003"
    environment:
      DB_USERNAME: ${DB_USERNAME:-maesamco}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_HOST: ${RDS_ENDPOINT}
      DB_PORT: "5432"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_MODEL_CHAT: ${AI_MODEL_CHAT:-anthropic}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HMAC_KEY_CONTENT_TO_COACHING: ${HMAC_KEY_CONTENT_TO_COACHING}
      HMAC_KEY_COACHING_TO_JUDGE: ${HMAC_KEY_COACHING_TO_JUDGE}
      HMAC_KEY_COACHING_TO_USER: ${HMAC_KEY_COACHING_TO_USER}
      HMAC_KEY_COACHING_TO_CONTENT: ${HMAC_KEY_COACHING_TO_CONTENT}
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
  judge0-data:
  grafana-data:
  caddy-data:
  caddy-config:

# ⚠️ 리뷰 반영(P1) — Compose 기본(default) 네트워크의 서브넷을 고정한다.
# caddy에게 이 대역 안의 고정 IP(172.28.255.10)를 줘서, RATE_LIMIT_TRUSTED_PROXY_IPS가
# 매 배포마다 같은 값으로 정확히 일치(exact match)하도록 하기 위함 — 다른
# 서비스들은 기존처럼 이 네트워크에 자동으로 붙으므로 별도 수정 불필요.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
