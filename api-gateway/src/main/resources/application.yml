server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**, /api/v1/auth/**
            - id: content-service
              uri: lb://content-service
              predicates:
                - Path=/api/v1/contents/**, /api/v1/admin/contents/**
            - id: judge-service
              uri: lb://judge-service
              predicates:
                - Path=/api/v1/submissions/**
            - id: coaching-service
              uri: lb://coaching-service
              predicates:
                - Path=/api/v1/coaching/**
            # ⚠️ /internal/v1/** 라우트는 의도적으로 등록하지 않는다 — 외부에서 접근 불가.
            # 통합 테스트용 — 각 서비스의 Swagger(OpenAPI) 문서를 Gateway 경유로 프록시.
            # /internal/v1/**과 달리 이건 의도적으로 외부에 열어둔 경로다.
            - id: user-service-docs
              uri: lb://user-service
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - RewritePath=/user-service/v3/api-docs, /v3/api-docs
            - id: content-service-docs
              uri: lb://content-service
              predicates:
                - Path=/content-service/v3/api-docs
              filters:
                - RewritePath=/content-service/v3/api-docs, /v3/api-docs
            - id: judge-service-docs
              uri: lb://judge-service
              predicates:
                - Path=/judge-service/v3/api-docs
              filters:
                - RewritePath=/judge-service/v3/api-docs, /v3/api-docs
            - id: coaching-service-docs
              uri: lb://coaching-service
              predicates:
                - Path=/coaching-service/v3/api-docs
              filters:
                - RewritePath=/coaching-service/v3/api-docs, /v3/api-docs
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  public-key: ${JWT_PUBLIC_KEY}   # User Service가 발급에 쓰는 Private Key의 짝, PEM 문자열

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness, /actuator/health/readiness 분리
  tracing:
    sampling:
      probability: 1.0

# 통합 테스트용 — http://localhost:8080/swagger-ui.html 에서 드롭다운으로
# 서비스 선택해서 각자 API 문서를 확인할 수 있다.
springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: content-service
        url: /content-service/v3/api-docs
      - name: judge-service
        url: /judge-service/v3/api-docs
      - name: coaching-service
        url: /coaching-service/v3/api-docs