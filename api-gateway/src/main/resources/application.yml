server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # ⚠️ P1 리뷰 반영: enabled: true였을 때 discovery locator가 자동으로
              # /{serviceId}/** 라우트를 만들면서 prefix를 벗겨 전달했음. 그 결과
              # /user-service/internal/v1/**처럼 요청하면 JwtValidationFilter의
              # "/internal/"로 시작하는지" 체크(원본 경로 기준)를 우회해서
              # 실제로 내부 API에 도달할 수 있었음(보안 구멍). 지금은 모든 라우트를
              # 아래처럼 명시적으로만 등록하므로 discovery locator 자체가 필요 없다.
              enabled: false
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**, /api/v1/auth/**
            - id: content-service
              uri: lb://content-service
              predicates:
                - Path=/api/v1/contents/**, /api/v1/admin/contents/**
            - id: judge-service
              uri: lb://judge-service
              predicates:
                - Path=/api/v1/submissions/**
            - id: coaching-service
              uri: lb://coaching-service
              predicates:
                - Path=/api/v1/coaching/**
            # ⚠️ /internal/v1/** 라우트는 의도적으로 등록하지 않는다 — 외부에서 접근 불가.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  public-key: ${JWT_PUBLIC_KEY}   # User Service가 발급에 쓰는 Private Key의 짝, PEM 문자열

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness, /actuator/health/readiness 분리
  tracing:
    sampling:
      probability: 1.0

# ⚠️ P1 리뷰 반영: profile 없이 기본값으로는 문서 자체를 완전히 끈다.
# 내부 API 상세 스펙이 문서에 노출될 수 있어, 운영 환경에 실수로 배포돼도
# 인증 없이 API 문서가 공개되는 사고를 막는다. 로컬 통합 테스트용 설정은
# application-dev.yml에 분리해뒀다(SPRING_PROFILES_ACTIVE=dev로 활성화).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

rate-limit:
  submissions:
    per-minute: ${RATE_LIMIT_SUBMISSIONS_PER_MIN:30}