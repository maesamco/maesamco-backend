server:
  port: 9002

spring:
  application:
    name: judge-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/maesamco
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    schemas: judge_schema
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: judge_schema
        format_sql: true
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic:
      problem-published: problem-published-events
    consumer:
      group-id: judge-service
      auto-offset-reset: earliest
      group:
        problem-published: judge-service-problem-published-group

jwt:
  public-key: ${JWT_PUBLIC_KEY}

internal:
  hmac:
    keys:
      content-service: ${HMAC_KEY_CONTENT_TO_JUDGE}
      coaching-service: ${HMAC_KEY_COACHING_TO_JUDGE}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_OTLP_URL:http://localhost:4318/v1/traces}